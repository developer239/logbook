name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request cancels its run in progress; on main every run finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The repository's rules in one fixed order, cheapest first, so the step a change fails at names the first rule it
  # broke.
  checks:
    name: checks
    runs-on: ubuntu-latest
    # The content hash of the npm-packages upload, which publish holds its download to.
    outputs:
      package-hash: ${{ steps.package-hash.outputs.package-hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so commitlint reaches both ends of a pull request's commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Values from the event reach the shell through env, never written into the script.
      - name: 1. Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
      - name: 2. Format
        run: pnpm format:check
      - name: 3. Dependency rule
        run: pnpm check:deps
      - name: 4. Harness-id literal check
        run: pnpm check:literals --harness
      - name: 5. Owner-specific literals and tracked files
        run: pnpm check:literals --owner
      - name: 6. Fixture and test conventions
        run: |
          pnpm check:fixtures
          pnpm check:tests
      - name: 7. Network call sites
        run: pnpm check:network
      - name: 8. Release guard
        run: pnpm check:release
      # The web tests build the demo through the staged CLI, so the build stages it before they run; step 14 still
      # checks the bundle on its own.
      - name: 9. Build packages
        run: pnpm build
      - name: 10. Lint
        run: pnpm lint
      - name: 11. Typecheck
        run: pnpm typecheck
      - name: 12. Unused code
        run: pnpm knip

      # The first eight hexadecimal digits of the head commit, so a re-run of the same commit shuffles the same way.
      - name: Shuffle seed
        id: seed
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          seed=$((16#${HEAD_SHA:0:8}))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Shuffle seed: $seed"
          {
            echo "Shuffle seed: $seed"
            echo
            echo "Reproduce the test order with: \`pnpm test --sequence.shuffle --sequence.seed=$seed\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 13. Unit to composition tests
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm test --sequence.seed="$SEED"
      # `pnpm stage` is a built-in command of pnpm 11, so the script runs through `pnpm run`.
      - name: 14. Bundle and stage
        run: pnpm run stage
      - name: 15. Package checks
        run: pnpm check:package
      # What users install: every staged package packed and installed offline, then the end-to-end suite against the
      # installed logbook, in the order of the same seed as step 13, and its offline test file again inside a network
      # namespace with only loopback up.
      - name: 16. Installed smoke
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm check:installed --seed "$SEED"
      # On a push to main, the exact packages this job built and tested, for publish: the publish order and every staged
      # directory, by their paths from the root. The hash is publish's: per file, the hex SHA-256 of its bytes, two
      # spaces and its path from the root; lines in byte order; the SHA-256 of that text.
      - name: 17. Package hash
        id: package-hash
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          hash=$( (echo build/publish-order.txt; while IFS= read -r directory; do find "$directory" -type f; done < build/publish-order.txt) |
            LC_ALL=C sort | while IFS= read -r file; do
              printf '%s  %s\n' "$(sha256sum -- "$file" | cut -d ' ' -f 1)" "$file"
            done | sha256sum | cut -d ' ' -f 1)
          echo "package-hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Package hash: $hash"
      - name: 18. Upload the packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: |
            build/publish-order.txt
            apps/cli/package
            packages/*/package
          retention-days: 7
          if-no-files-found: error

  # The shim on Node older than the floor, with nothing installed and nothing built: it must stay parseable there and
  # refuse with its one line.
  shim:
    name: shim (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Refusal on old Node
        run: |
          out="$RUNNER_TEMP/shim-stdout"
          err="$RUNNER_TEMP/shim-stderr"
          code=0
          node apps/cli/bin/logbook.cjs --version > "$out" 2> "$err" || code=$?
          version=$(node -p process.versions.node)
          node_path=$(node -p process.execPath)
          expected="$RUNNER_TEMP/shim-expected"
          printf '%s\n' "Log Book needs Node.js 24.15 or newer; this is Node.js $version at $node_path. Install Node.js 24.15 (https://nodejs.org) or switch to it with your version manager, then run logbook again." > "$expected"
          echo "Exit code: $code"
          echo "stderr:"
          cat "$err"
          status=0
          if [ "$code" -ne 5 ]; then
            echo "::error::The shim exited $code on Node $version, not 5."
            status=1
          fi
          if [ -s "$out" ]; then
            echo "::error::The shim wrote to stdout on Node $version."
            status=1
          fi
          if ! cmp -s "$expected" "$err"; then
            echo "::error::The shim's stderr on Node $version is not the one refusal line."
            diff "$expected" "$err" || true
            status=1
          fi
          exit "$status"

  # The packed CLI built, tested and installed on each supported runner, from the Node floor up; the format, lint and
  # literal checks do not depend on the platform and stay in checks. On the Linux rows check:installed includes the
  # offline run in a network namespace.
  platforms:
    name: platforms (${{ matrix.runner }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform's failure does not hide another's.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            node: 24.15.0
          - runner: ubuntu-24.04-arm
            node: current
          - runner: macos-latest
            node: 24.15.0
          - runner: macos-latest
            node: current
          - runner: macos-26-intel
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build
      # The first eight hexadecimal digits of the head commit, so a re-run of the same commit shuffles the same way.
      - name: Shuffle seed
        id: seed
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          seed=$((16#${HEAD_SHA:0:8}))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Shuffle seed: $seed"
          {
            echo "Shuffle seed: $seed"
            echo
            echo "Reproduce the test order with: \`pnpm test --sequence.shuffle --sequence.seed=$seed\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Unit to composition tests
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm test --sequence.seed="$SEED"
      - name: Installed smoke
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm check:installed --seed "$SEED"

  # The demo dataset's checks that need a built set, the scan of committed demo captures that packages/ci cannot run
  # itself, since it may not import the demo package, and the documentation site, built from the same commit with the
  # rich build's captures and checked. Its test commands are test:demo and test:docs, which no other job runs.
  demo:
    name: demo
    runs-on: ubuntu-latest
    # actions: read lets gh download main's text captures as the baseline of the text change report.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 1. Build packages
        run: pnpm build
      - name: 2. Purity scan
        run: pnpm demo:purity
      # The first eight hexadecimal digits of the head commit, so a re-run of the same commit shuffles the same way.
      - name: Shuffle seed
        id: seed
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          seed=$((16#${HEAD_SHA:0:8}))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Shuffle seed: $seed"
          {
            echo "Shuffle seed: $seed"
            echo
            echo "Reproduce the test order with: \`pnpm test:demo --sequence.shuffle --sequence.seed=$seed\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 3. Demo build tests
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm test:demo --sequence.seed="$SEED"
      # Each set built fresh into a new directory, then held to the demo's checks C1 to C5. The rich build stays where
      # step 7 captures the documentation site's shots from it.
      - name: 4. Privacy check on fresh builds
        run: |
          check_fresh() {
            out=$1
            shift
            pnpm demo:build "$@" --out "$out"
            pnpm demo:check --out "$out"
          }
          check_fresh "$(mktemp -d)" --size small
          check_fresh "$RUNNER_TEMP/demo-rich" --size rich
          check_fresh "$(mktemp -d)" --size small --labels none
      # Rule M6: each demo entry's text capture scanned against the build it names, with C4, C5 and its session ids.
      - name: 5. Committed demo captures
        run: |
          listed="$RUNNER_TEMP/demo-captures.txt"
          node packages/ci/dist/index.js demo-captures > "$listed"
          if [ ! -s "$listed" ]; then
            echo "apps/docs/committed-captures.json has no demo entry; nothing to scan."
            exit 0
          fi
          while read -r text size_flag size seed_flag seed; do
            # The scan reads no input; its stdin is not the list the loop reads.
            pnpm demo:scan "$text" "$size_flag" "$size" "$seed_flag" "$seed" < /dev/null
          done < "$listed"
      # Chromium for the site's browser tests and captures, cached per Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/docs/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: 6. Documentation browser tests
        run: |
          pnpm --filter @log-book/docs exec playwright install --with-deps chromium
          pnpm test:docs
      - name: 7. Build the documentation site
        run: pnpm docs:build --demo-out "$RUNNER_TEMP/demo-rich"
      - name: 8. Documentation checks
        run: pnpm docs:check
      # The reviewer's view of what the change did to the site: which shots' text changed against main, in the summary,
      # and the built site to look at, since a layout change that keeps every text passes the checks.
      - name: 9. Text changes against main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline="$RUNNER_TEMP/docs-text-main"
          run_id=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name docs-text --dir "$baseline" ||
              echo "The newest successful run on main, $run_id, retains no docs-text artefact."
          fi
          pnpm --silent docs:text-changes --baseline "$baseline" >> "$GITHUB_STEP_SUMMARY"
      - name: 9. Upload the built site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: apps/docs/.vitepress/dist
          retention-days: 7
          if-no-files-found: error
      # The baseline the next pull requests compare their text captures with.
      - name: 10. Upload the text captures
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-text
          path: apps/docs/src/public/captures/*.txt
          retention-days: 30
          if-no-files-found: error

  # On a push to main whose four jobs passed: semantic-release decides the version and writes the tag and a GitHub
  # pre-release, holding no npm right. Before anything is installed, the dist-tags of every published package are
  # recorded, so nothing of the dependency tree can alter what verify compares with.
  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, shim, platforms, demo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      packages: ${{ steps.dist-tags.outputs.packages }}
      latest-before: ${{ steps.dist-tags.outputs.latest-before }}
      recorded-at: ${{ steps.dist-tags.outputs.recorded-at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release reads every tag and commit.
          fetch-depth: 0
      - name: 1. Record the dist-tags
        id: dist-tags
        run: |
          list=packages/ci/src/rules/public-packages.json
          recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          latest='{}'
          for name in $(jq -r '.[].name' "$list"); do
            tags=$(curl -fsS "https://registry.npmjs.org/-/package/$name/dist-tags")
            latest=$(jq -c --arg name "$name" --argjson tags "$tags" '. + {($name): $tags.latest}' <<< "$latest")
          done
          {
            echo "packages=$(jq -c '[.[].name]' "$list")"
            echo "latest-before=$latest"
            echo "recorded-at=$recorded_at"
          } >> "$GITHUB_OUTPUT"
          echo "latest before the release, at $recorded_at: $latest"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Builds packages/ci, then writes version=X.Y.Z, or version= when the commits call for no release.
      - name: 2. Decide the version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:version
      # @semantic-release/github marks a release from the main release branch as the repository's latest.
      - name: 3. Mark the release a pre-release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease

  # The exact packages checks built and tested, published to next; packages/ci/src/rules/publish-job.yaml is its
  # template, which check:release holds it to.
  publish:
    needs: [checks, release]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    environment: npm-next
    permissions:
      id-token: write
    # Values from other jobs reach the scripts through env, never written into them.
    env:
      VERSION: ${{ needs.release.outputs.version }}
      PACKAGE_HASH: ${{ needs.checks.outputs.package-hash }}
      NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: npm-packages
      # Any job of the run could replace an artefact of the same name, so its content hash must be the one checks wrote:
      # per file, the hex SHA-256 of its bytes, two spaces and its path from the root; lines in byte order; the SHA-256 of
      # that text.
      - name: Check the artefact, the version and the publish order
        run: |
          hash=$(cd npm-packages && find . -type f | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r file; do
            printf '%s  %s\n' "$(sha256sum -- "$file" | cut -d ' ' -f 1)" "$file"
          done | sha256sum | cut -d ' ' -f 1)
          if [ "$hash" != "$PACKAGE_HASH" ]; then
            echo "The npm-packages artefact hashes to $hash, not to the $PACKAGE_HASH the checks job wrote."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version $VERSION is not X.Y.Z."
            exit 1
          fi
          if grep -vxE 'apps/cli/package|packages/[a-z-]+/package' npm-packages/build/publish-order.txt; then
            echo "publish-order.txt holds the lines above, which are not staged package directories."
            exit 1
          fi
      # npm bundles its dependencies, so the unpacked directory runs alone; trusted publishing needs npm 11.5.1 or later.
      # Every npm command below is this file; the runner's own npm never runs.
      - name: Fetch npm and check its integrity
        run: |
          curl --fail --silent --show-error --location --output npm.tgz https://registry.npmjs.org/npm/-/npm-11.21.0.tgz
          integrity="sha512-$(openssl dgst -sha512 -binary npm.tgz | base64 --wrap=0)"
          if [ "$integrity" != "$NPM_INTEGRITY" ]; then
            echo "npm-11.21.0.tgz has the integrity $integrity, not $NPM_INTEGRITY."
            exit 1
          fi
          mkdir npm
          tar --extract --gzip --file npm.tgz --directory npm --strip-components 1
          if [ "$(node npm/bin/npm-cli.js --version)" != "11.21.0" ]; then
            echo "The unpacked npm is not 11.21.0."
            exit 1
          fi
      # Dependencies first and the CLI last, so no package names a version npm does not have yet. A package the registry
      # already has at this version, from a re-run, is skipped when its tarball is the same and stops the job when not.
      # npm exchanges the job's OIDC token for a publish token and attaches the provenance attestation itself.
      - name: Publish to next
        run: |
          npm_cli="$PWD/npm/bin/npm-cli.js"
          while IFS= read -r directory; do
            package="npm-packages/$directory"
            (
              cd "$package"
              node "$npm_cli" pkg set "version=$VERSION"
              for dependency in $(node "$npm_cli" pkg get dependencies --json | node --input-type=module --eval \
                "process.stdout.write(Object.keys(JSON.parse(await new Response(process.stdin).text())).filter((name) => name.startsWith('@log-book/')).join(' '))"); do
                node "$npm_cli" pkg set "dependencies.$dependency=$VERSION"
              done
            )
            name=$(node "$npm_cli" pkg get name --prefix "$package" | tr -d '"')
            if published=$(node "$npm_cli" view "$name@$VERSION" dist.integrity 2> view-error.txt); then
              :
            elif grep -q E404 view-error.txt; then
              published=""
            else
              cat view-error.txt
              exit 1
            fi
            if [ -n "$published" ]; then
              packed=$(cd "$package" && node "$npm_cli" pack --dry-run --json --ignore-scripts | node --input-type=module --eval \
                "process.stdout.write(JSON.parse(await new Response(process.stdin).text())[0].integrity)")
              if [ "$packed" != "$published" ]; then
                echo "$name@$VERSION is on the registry with $published, but $directory packs to $packed."
                exit 1
              fi
              echo "$name@$VERSION is already on the registry with the same tarball; skipped."
              continue
            fi
            node "$npm_cli" publish "./$package" --tag next --ignore-scripts
          done < npm-packages/build/publish-order.txt

  # What publish did, checked by a job holding no npm right, since a compromised publish could skip a check of its own:
  # next at the version, latest where release recorded it or where a promotion since moved it, every package's
  # provenance, and the GitHub release a pre-release. It runs also when publish failed.
  verify:
    name: verify
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' }}
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
      PACKAGES: ${{ needs.release.outputs.packages }}
      LATEST_BEFORE: ${{ needs.release.outputs.latest-before }}
      RECORDED_AT: ${{ needs.release.outputs.recorded-at }}
      # How long verify waits for the registry to show the release; it took about 5 minutes for 1.0.0.
      WAIT_SECONDS: 900
    steps:
      # The registry shows a version some minutes after its upload, so verify judges it only once every package shows
      # next at the version and its provenance, or once the wait is over; the checks then report whatever is missing.
      - name: Wait for the registry
        run: |
          started=$(date +%s)
          while :; do
            waiting=''
            for name in $(jq -r '.[]' <<< "$PACKAGES"); do
              next=$(curl -fsS "https://registry.npmjs.org/-/package/$name/dist-tags" | jq -r '.next // ""')
              code=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/-/npm/v1/attestations/${name/\//%2f}@$VERSION")
              if [ "$next" != "$VERSION" ] || [ "$code" != 200 ]; then
                waiting="$waiting $name"
              fi
            done
            waited=$(($(date +%s) - started))
            if [ -z "$waiting" ]; then
              echo "The registry shows $VERSION of every package after ${waited}s."
              break
            fi
            if [ "$waited" -ge "$WAIT_SECONDS" ]; then
              echo "After ${waited}s the registry still lacks $VERSION of:$waiting."
              break
            fi
            echo "After ${waited}s still waiting for:$waiting"
            sleep 30
          done
      - name: Check the registry and the release
        run: |
          status=0
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
            --jq '.workflows[] | select(.path == ".github/workflows/promote.yml") | .id')
          promoted=''
          if [ -n "$workflow" ]; then
            promoted=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&status=success&per_page=100" \
              --jq ".workflow_runs[] | select(.updated_at > \"$RECORDED_AT\") | .display_title")
          fi
          for name in $(jq -r '.[]' <<< "$PACKAGES"); do
            tags=$(curl -fsS "https://registry.npmjs.org/-/package/$name/dist-tags")
            next=$(jq -r '.next // ""' <<< "$tags")
            now=$(jq -r '.latest // ""' <<< "$tags")
            before=$(jq -r --arg name "$name" '.[$name] // ""' <<< "$LATEST_BEFORE")
            if [ "$next" != "$VERSION" ]; then
              echo "::error::next of $name is ${next:-unset}, not $VERSION."
              status=1
            fi
            if [ "$now" != "$before" ] && ! grep -qxF "promote $now" <<< "$promoted"; then
              echo "::error::latest of $name moved from $before to $now outside a promotion. Dispatch promote.yml for $before with rollback set, deprecate $now, and treat the cause as an incident."
              status=1
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/-/npm/v1/attestations/${name/\//%2f}@$VERSION")
            if [ "$code" != 200 ]; then
              echo "::error::$name@$VERSION has no provenance attestation: the registry answered $code."
              status=1
            fi
          done
          if [ "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" != true ]; then
            echo "::error::The GitHub release v$VERSION is not a pre-release."
            status=1
          fi
          exit "$status"
