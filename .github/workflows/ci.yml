name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request cancels its run in progress; on main every run finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The repository's rules in one fixed order, cheapest first, so the step a change fails at names the first rule it
  # broke.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so commitlint reaches both ends of a pull request's commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Values from the event reach the shell through env, never written into the script.
      - name: 1. Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
      - name: 2. Format
        run: pnpm format:check
      - name: 3. Dependency rule
        run: pnpm check:deps
      - name: 4. Harness-id literal check
        run: pnpm check:literals --harness
      - name: 5. Owner-specific literals and tracked files
        run: pnpm check:literals --owner
      - name: 6. Fixture and test conventions
        run: |
          pnpm check:fixtures
          pnpm check:tests
      - name: 7. Network call sites
        run: pnpm check:network
      - name: 8. Release guard
        run: pnpm check:release
      # The web tests build the demo through the staged CLI, so the build stages it before they run; step 14 still
      # checks the bundle on its own.
      - name: 9. Build packages
        run: pnpm build
      - name: 10. Lint
        run: pnpm lint
      - name: 11. Typecheck
        run: pnpm typecheck
      - name: 12. Unused code
        run: pnpm knip

      # The first eight hexadecimal digits of the head commit, so a re-run of the same commit shuffles the same way.
      - name: Shuffle seed
        id: seed
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          seed=$((16#${HEAD_SHA:0:8}))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Shuffle seed: $seed"
          {
            echo "Shuffle seed: $seed"
            echo
            echo "Reproduce the test order with: \`pnpm test --sequence.shuffle --sequence.seed=$seed\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 13. Unit to composition tests
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm test --sequence.seed="$SEED"
      # `pnpm stage` is a built-in command of pnpm 11, so the script runs through `pnpm run`.
      - name: 14. Bundle and stage
        run: pnpm run stage
      - name: 15. Package checks
        run: pnpm check:package
      # What users install: every staged package packed and installed offline, then the end-to-end suite against the
      # installed logbook, in the order of the same seed as step 13, and its offline test file again inside a network
      # namespace with only loopback up.
      - name: 16. Installed smoke
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm check:installed --seed "$SEED"

  # The shim on Node older than the floor, with nothing installed and nothing built: it must stay parseable there and
  # refuse with its one line.
  shim:
    name: shim (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Refusal on old Node
        run: |
          out="$RUNNER_TEMP/shim-stdout"
          err="$RUNNER_TEMP/shim-stderr"
          code=0
          node apps/cli/bin/logbook.cjs --version > "$out" 2> "$err" || code=$?
          version=$(node -p process.versions.node)
          node_path=$(node -p process.execPath)
          expected="$RUNNER_TEMP/shim-expected"
          printf '%s\n' "Log Book needs Node.js 24.15 or newer; this is Node.js $version at $node_path. Install Node.js 24.15 (https://nodejs.org) or switch to it with your version manager, then run logbook again." > "$expected"
          echo "Exit code: $code"
          echo "stderr:"
          cat "$err"
          status=0
          if [ "$code" -ne 5 ]; then
            echo "::error::The shim exited $code on Node $version, not 5."
            status=1
          fi
          if [ -s "$out" ]; then
            echo "::error::The shim wrote to stdout on Node $version."
            status=1
          fi
          if ! cmp -s "$expected" "$err"; then
            echo "::error::The shim's stderr on Node $version is not the one refusal line."
            diff "$expected" "$err" || true
            status=1
          fi
          exit "$status"

  # The packed CLI built, tested and installed on each supported runner, from the Node floor up; the format, lint and
  # literal checks do not depend on the platform and stay in checks. On the Linux rows check:installed includes the
  # offline run in a network namespace.
  platforms:
    name: platforms (${{ matrix.runner }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform's failure does not hide another's.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            node: 24.15.0
          - runner: ubuntu-24.04-arm
            node: current
          - runner: macos-latest
            node: 24.15.0
          - runner: macos-latest
            node: current
          - runner: macos-26-intel
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build
      # The first eight hexadecimal digits of the head commit, so a re-run of the same commit shuffles the same way.
      - name: Shuffle seed
        id: seed
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          seed=$((16#${HEAD_SHA:0:8}))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Shuffle seed: $seed"
          {
            echo "Shuffle seed: $seed"
            echo
            echo "Reproduce the test order with: \`pnpm test --sequence.shuffle --sequence.seed=$seed\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Unit to composition tests
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm test --sequence.seed="$SEED"
      - name: Installed smoke
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm check:installed --seed "$SEED"

  # The demo dataset's checks that need a built set, and the scan of committed demo captures that packages/ci cannot
  # run itself, since it may not import the demo package. Its one test command is test:demo; its other steps are static
  # checks, so no check runs both here and in checks.
  demo:
    name: demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 1. Build packages
        run: pnpm build
      - name: 2. Purity scan
        run: pnpm demo:purity
      # The first eight hexadecimal digits of the head commit, so a re-run of the same commit shuffles the same way.
      - name: Shuffle seed
        id: seed
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          seed=$((16#${HEAD_SHA:0:8}))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Shuffle seed: $seed"
          {
            echo "Shuffle seed: $seed"
            echo
            echo "Reproduce the test order with: \`pnpm test:demo --sequence.shuffle --sequence.seed=$seed\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 3. Demo build tests
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm test:demo --sequence.seed="$SEED"
      # Each set built fresh into a new directory, then held to the demo's checks C1 to C5.
      - name: 4. Privacy check on fresh builds
        run: |
          check_fresh() {
            out=$(mktemp -d)
            pnpm demo:build "$@" --out "$out"
            pnpm demo:check --out "$out"
          }
          check_fresh --size small
          check_fresh --size rich
          check_fresh --size small --labels none
      # Rule M6: each demo entry's text capture scanned against the build it names, with C4, C5 and its session ids.
      - name: 5. Committed demo captures
        run: |
          listed="$RUNNER_TEMP/demo-captures.txt"
          node packages/ci/dist/index.js demo-captures > "$listed"
          if [ ! -s "$listed" ]; then
            echo "apps/docs/committed-captures.json has no demo entry; nothing to scan."
            exit 0
          fi
          while read -r text size_flag size seed_flag seed; do
            # The scan reads no input; its stdin is not the list the loop reads.
            pnpm demo:scan "$text" "$size_flag" "$size" "$seed_flag" "$seed" < /dev/null
          done < "$listed"
