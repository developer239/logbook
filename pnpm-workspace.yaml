packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true
  # Downloads a GPL-licensed ffmpeg build that encodes the site's videos at build time; nothing of it is redistributed.
  ffmpeg-static: true
minimumReleaseAgeExclude:
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261003.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261003.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20261003.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20261003.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20261003.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20261003.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20261003.1'
  - typescript@7.1.0-dev.20261003.1

catalog:
  '@astrojs/node': 11.1.6
  '@astrojs/ts-content-mapper': 0.2.0
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  '@commitlint/lint': 21.2.3
  '@commitlint/load': 21.2.3
  '@commitlint/types': 21.2.3
  '@types/node': 24.19.1
  astro: 7.3.5
  esbuild: 0.28.2
  ffmpeg-static: 5.3.0
  husky: 9.1.7
  knip: 6.39.0
  lint-staged: 17.6.0
  mermaid: 12.1.0
  oxfmt: 0.71.0
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  playwright: 1.63.0
  stylelint: 17.16.0
  typescript: 7.1.0-dev.20261003.1
  vitepress: 1.6.3
  vitepress-mermaid-renderer: 1.2.2
  vitest: 5.0.3
  vue: 3.5.39
  yaml: 2.9.1
